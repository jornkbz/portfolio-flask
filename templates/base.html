<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <title> {% block title %} {% endblock %} - Portafolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/bootstrap.min.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/all.min.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/styles.css') }}?v=1.0.7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
</head>

<body>
    <canvas id="matrix-rain"></canvas>

    {% block content %}

    {% endblock %}

    <div id="ai-widget-container-v3">

        <div id="ai-window-v3" class="terminal-window">
            <div class="d-flex justify-content-between align-items-center p-2 header-bar"
                style="background: rgba(0, 40, 0, 0.9); border-bottom: 1px solid #00FF41;">
                <span class="text-success small fw-bold" style="font-family: 'Share Tech Mono';">
                    <i class="fas fa-robot me-2"></i>ORACLE_SYSTEM
                </span>
                <button class="btn-close-custom" style="background:none; border:none; color:#00FF41;">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div id="ai-chat-box-v3" class="p-3 chat-content"
                style="height: 350px; overflow-y: auto; background: rgba(0,0,0,0.95);">
                <div class="mb-2">
                    <span class="text-success fw-bold">[SYSTEM]:</span>
                    <span class="text-white small">Enlace establecido. Pregúntame sobre José.</span>
                </div>
            </div>

            <div class="p-2 input-area d-flex align-items-center"
                style="background: rgba(0, 20, 0, 0.95); border-top: 1px solid #00FF41;">
                <span class="text-success me-1">></span>
                <input type="text" id="ai-input-v3" class="bg-transparent border-0 text-white w-100 small custom-input"
                    style="outline:none; font-family:'Share Tech Mono';" placeholder="Escribe aquí..."
                    autocomplete="off">
                <button class="btn-send-custom ms-2" style="background:none; border:none; color:#00FF41;">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <button id="ai-trigger-v3" class="btn-glitch-active">
            <i class="fas fa-brain"></i>
            <span class="ms-2 d-none d-md-inline">AI_ASSISTANT</span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename = 'js/bootstrap.bundle.min.js')}}"></script>
    <!-- Main JS Logic -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
