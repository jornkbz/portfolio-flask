name: CI/CD Portfolio Flask

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Evita dos despliegues simultáneos sobre el VPS
concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jornkbz/portfolio-flask   # en minúsculas (usuario/repo)
  DEPLOY_DIR: /srv/docker/portfolio-flask

jobs:
  # 1. Auditoría de dependencias: si hay CVEs conocidas, no se construye ni despliega
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict

  build-and-deploy:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest (lo que usa el VPS) + sha-xxxxxxx (para poder volver atrás)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El docker-compose.yml del repo viaja dentro del paso SSH (base64) para mantener el VPS sincronizado
      - name: Encode docker-compose.yml
        run: echo "COMPOSE_B64=$(base64 -w0 docker-compose.yml)" >> "$GITHUB_ENV"

      - name: Deploy to VPS using SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          COMPOSE_B64: ${{ env.COMPOSE_B64 }}
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USERNAME }}
          key: ${{ secrets.IONOS_SSH_KEY }}
          port: ${{ secrets.IONOS_SSH_PORT }}
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_DIR,COMPOSE_B64
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_DIR"

            # Sincronizar docker-compose.yml con el del repositorio (guardando el anterior)
            mkdir -p backups
            [ -f docker-compose.yml ] && cp docker-compose.yml backups/docker-compose.yml.prev
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml.new
            docker compose -f docker-compose.yml.new config -q
            mv docker-compose.yml.new docker-compose.yml

            # Volúmenes persistentes (BD SQLite e imágenes subidas desde el panel)
            mkdir -p data static/img/uploads backups
            if [ -f data/database.db ]; then
              cp data/database.db "backups/database-$(date +%Y%m%d-%H%M%S).db"
              ls -1t backups/database-*.db | tail -n +11 | xargs -r rm --
            fi

            # Login temporal para bajar la imagen; se cierra al terminar para no dejar el token guardado
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker logout ghcr.io

            # Reiniciar SOLO el portafolio (NPM lo alcanza por la red 'neura_django')
            docker compose up -d --remove-orphans

            # Esperar a que el healthcheck pase
            for i in $(seq 1 20); do
              status=$(docker inspect -f '{{.State.Health.Status}}' mi_portfolio_container 2>/dev/null || echo unknown)
              [ "$status" = "healthy" ] && echo "Contenedor healthy" && break
              sleep 3
            done
            [ "$status" = "healthy" ] || { docker logs --tail 50 mi_portfolio_container; exit 1; }

            docker image prune -f
